# voyager-hibernate.conf — hibernate image settings.
#   The "2h s2idle then hibernate" delay lives in the voyager-deferred-hibernate
#   system-sleep hook (DELAY=), NOT here — systemd's suspend-then-hibernate +
#   HibernateDelaySec are unreliable on this hardware (no usable ACPI _BTP;
#   systemd#35743). This file only pins the hibernate image mode.
[Sleep]
HibernateMode=platform shutdown
