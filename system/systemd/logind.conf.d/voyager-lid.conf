# voyager-lid.conf — lid-close behavior.
#   AC and battery both do plain s2idle suspend (~0.5 W; instant reopen, no
#   LUKS prompt). On battery, the voyager-deferred-hibernate system-sleep hook
#   arms the RTC to fall through to disk hibernate after 2h, so a closed lid
#   overnight doesn't drain the battery.
#
#   We deliberately do NOT use systemd's suspend-then-hibernate: it's broken on
#   this hardware (no usable ACPI _BTP → the estimator wakes every ~30 min and
#   never hibernates; systemd#35743). See docs/VOYAGER.md.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
